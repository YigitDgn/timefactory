[package]
name = "timefactory"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "TimeFactory"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow"] }
egui-phosphor = "0.14"
raw-window-handle = "0.6"
rusqlite = { version = "0.41", features = ["bundled"] }
jiff = "0.2"
winapi = { version = "0.3", features = ["winuser", "commctrl", "processthreadsapi", "winbase", "handleapi", "synchapi", "errhandlingapi", "winerror", "winver", "minwindef", "windef", "winnt", "dwmapi", "uxtheme", "winreg", "libloaderapi", "wingdi", "shellapi", "sysinfoapi"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
